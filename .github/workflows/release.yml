name: Release

# Tag a version and this builds, packages and publishes the app, then points the
# Homebrew cask at the new download. Nothing here runs on an ordinary push.
#
# The app is ad-hoc signed, not signed with a Developer ID and not notarised: that
# needs a paid Apple Developer Program membership, which this project does not have.
# Ad-hoc is not a formality — arm64 binaries must carry a signature to run at all, and
# it is what embeds the sandbox and audio-input entitlements the app cannot work
# without. What it does not do is satisfy Gatekeeper, so anyone who downloads a release
# has to allow the app once by hand. The README explains that to them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Run the tests
        working-directory: Packages/AudioManagerKit
        run: swift test --parallel

      - name: Build
        run: |
          xcodebuild build \
            -project AudioManager.xcodeproj \
            -scheme AudioManager \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            -quiet

      # Xcode treats an ad-hoc identity as a development build and injects
      # get-task-allow, which lets any process running as the same user attach a
      # debugger and defeats the hardened runtime. Re-signing with the generated
      # entitlements minus that one keeps the sandbox and the audio entitlement — which
      # the app genuinely needs — and drops the one that should never ship.
      - name: Harden the signature and check what we are about to publish
        run: |
          app="build/Build/Products/Release/AudioManager.app"
          entitlements="$RUNNER_TEMP/entitlements.plist"
          codesign -d --entitlements "$entitlements" --xml "$app"
          plutil -convert xml1 "$entitlements"
          /usr/libexec/PlistBuddy -c \
            "Delete :com.apple.security.get-task-allow" "$entitlements" || true
          codesign --force --sign - --entitlements "$entitlements" --options runtime "$app"

          echo "Entitlements the published app carries:"
          codesign -d --entitlements - --xml "$app" | plutil -convert xml1 -o - -
          codesign --verify --strict --verbose=2 "$app"

          # The app must not ship with the debug entitlement, so fail rather than
          # publish one that does.
          if codesign -d --entitlements - --xml "$app" \
              | plutil -convert xml1 -o - - \
              | grep -q "get-task-allow"; then
            echo "::error::get-task-allow is still present — refusing to publish."
            exit 1
          fi

          # The runners are Apple Silicon, so an arm64-only slice builds and passes
          # every check here while simply refusing to launch on an Intel Mac. The
          # README promises both, so prove both are in the binary.
          echo "Architectures: $(lipo -archs "$app/Contents/MacOS/AudioManager")"
          for arch in arm64 x86_64; do
            if ! lipo -archs "$app/Contents/MacOS/AudioManager" | grep -qw "$arch"; then
              echo "::error::$arch is missing — refusing to publish a build that cannot run everywhere the README claims."
              exit 1
            fi
          done

      - name: Package
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="AudioManager-$version.zip"
          ditto -c -k --keepParent "build/Build/Products/Release/AudioManager.app" "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Release notes live in the repo so the published release and the changelog cannot
      # drift apart. A version without a notes file falls back to generated ones.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="docs/release-notes-v$version.md"
          if [ -f "$notes" ]; then
            notes_flag=(--notes-file "$notes")
          else
            notes_flag=(--generate-notes)
          fi
          gh release create "v$version" "${{ steps.package.outputs.archive }}" \
            --title "Audio Manager $version" \
            "${notes_flag[@]}" || \
          gh release upload "v$version" "${{ steps.package.outputs.archive }}" --clobber

      # The cask lives in this repo, so a release is only finished once it points at the
      # build that was just published.
      - name: Point the Homebrew cask at this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          sha="${{ steps.package.outputs.sha256 }}"
          sed -i '' -E "s/^  version \".*\"$/  version \"$version\"/" Casks/audio-manager.rb
          sed -i '' -E "s|^  sha256 .*$|  sha256 \"$sha\"|" Casks/audio-manager.rb
          if git diff --quiet Casks/audio-manager.rb; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/audio-manager.rb
          git commit -m "chore: point the cask at $version"
          git push origin HEAD:${{ github.event.repository.default_branch }}
